services:
  ticketmaster:
    image: ticketmaster
    build:
      context: .
      dockerfile: TicketMaster/Dockerfile

  bookingapi:
    image: bookingapi
    build:
      context: .
      dockerfile: BookingApi/Dockerfile

  booking.slq:
    image: booking.slq
    build:
      context: .
      dockerfile: Booking.Slq/Dockerfile

  events.api:
    image: events.api
    build:
      context: .
      dockerfile: Events.Api/Dockerfile

  users.api:
    image: users.api
    build:
      context: .
      dockerfile: Users.Api/Dockerfile

  # Backing store for Events.Api. The account key below is Microsoft's well-known emulator key,
  # identical on every machine and not a secret.
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: ticketmaster-cosmos
    tty: true
    mem_limit: 3g
    cpu_count: 2
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 3
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    volumes:
      - cosmos-data:/tmp/cosmos/appdata

volumes:
  cosmos-data:


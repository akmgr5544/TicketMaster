syntax = "proto3";

package events.v1;

option csharp_namespace = "TicketMaster.Common.Protos.Events.V1";

// Synchronous reads other services cannot get from an integration event. Anything the catalogue
// already announces belongs on the broker instead — see the `rpc` skill.
service EventsLookup {
  rpc GetEvent (GetEventRequest) returns (GetEventReply);
}

message GetEventRequest {
  string event_id = 1;
}

// A missing event is a NOT_FOUND status, not an empty reply.
message GetEventReply {
  string id = 1;
  Venue venue = 2;
  // Absent for an event stored before pricing existed.
  Pricing pricing = 3;
}

message Pricing {
  // A decimal in invariant culture ("49.99"): proto3 has no decimal type, and a double would round money.
  string ticket_price = 1;
  string currency = 2;
  string organizer_id = 3;
  // Seat → price for the seats in a price tier, in the same decimal-string form; a seat absent here sells at
  // ticket_price.
  map<string, string> seat_prices = 4;
}

message Venue {
  string id = 1;
  string name = 2;
  repeated string seats = 3;
}
